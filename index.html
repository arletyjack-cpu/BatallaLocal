<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Batalla local</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="game has-text-black" id="juego">
  <!-- HEADER -->
  <header class="top is-flex is-justify-content-space-between is-align-items-center" id="encabezado">
    <span class="title is-4 has-text-white mb-0">Batalla local</span>
    <button class="button pause" id="botonPausa" aria-label="Pausa">❚❚</button>
  </header>

  <!-- PERSONAJES -->
  <section class="menuGui" id="personajes" style="display: none;"></section>

  <!-- MOCHILA -->
  <section class="menuGui" id="mochila" style="display: none;"></section>

  <!-- BATTLE ARENA -->
  <section class="arena main-gui" id="arena">
    <div class="arena-background" id="arenaBackground" aria-hidden="true"></div>

    <!-- BATTLE HUD -->
    <div class="hud" id="informacionBatalla">

      <!-- PLAYER 1 -->
      <div class="life life-player1" id="estadoAliado">
        <div class="health-bar">
          <progress class="progress is-success" id="barraVidaAliado" value="67" max="67"></progress>
          <div class="health-label">
            <span>Vida</span><span id="vidaAliado">--</span>
          </div>
        </div>
        <div class="tag turn-tag" id="turnoAliado">Equipo aliado/ Tu turno</div>
      </div>

      <!-- ROUND -->
      <div class="round has-text-centered" id="ronda">
        <span class="is-size-6" id="clima">Soleado</span>
        <span class="has-text-weight-bold" id="numeroRonda">Ronda 67</span>
        <small id="ventajaElemental">Todo x67</small>
      </div>

      <!-- PLAYER 2 -->
      <div class="life life-player2" id="estadoEnemigo">
        <div class="health-bar">
          <progress class="progress is-success" id="barraVidaEnemigo" value="67" max="67"></progress>
          <div class="health-label">
            <span>Vida</span><span id="vidaEnemigo">--</span>
          </div>
        </div>
        <div class="tag turn-tag" id="turnoEnemigo">Equipo rival</div>
      </div>
    </div>

    <!-- CHARACTERS -->

    <!-- PLAYER CARD -->
    <div class="player-cat" id="canvasAliado">
      <img class="player-image" id="imagenAliado" src="images/placeholder.webp" alt="Aliado">
      <img class="player-overlay" id="overlayAliado" src="images/Halo.webp" alt="Halo">
    </div>

    <article class="card character-card jugador" id="tarjetaAliado">
      <div class="card-content">
        <div class="is-flex is-justify-content-space-between is-align-items-center">
          <strong id="nombreAliado">Gato Bobo</strong>
          <span id="nivelAliado">Nv 67</span>
        </div>
        <div class="is-flex is-justify-content-space-between character-types" id="tiposAliado">
          <span class="tag" id="tipoAliado">--</span>
        </div>
        <div class="is-flex is-justify-content-space-between is-align-items-center character-footer">
          <span id="propietarioAliado">Equipo Aliado</span>
          <span id="indicadoresAliado">🟢🟢🟢</span>
        </div>
      </div>
    </article>

    <!-- ENEMY CARD -->
    <div class="enemy-cat" id="canvasEnemigo">
      <img class="enemy-image" id="imagenEnemigo" src="images/placeholder.webp" alt="Enemigo">
      <img class="enemy-overlay" id="overlayEnemigo" src="images/Horns.webp" alt="Horns">
    </div>
    <article class="card character-card enemigo" id="tarjetaEnemigo">
      <div class="card-content">
        <div class="is-flex is-justify-content-space-between is-align-items-center">
          <span id="nivelEnemigo">Nv 67</span>
          <strong id="nombreEnemigo">Gato Tonto</strong>
        </div>
        <div class="is-flex is-justify-content-space-between character-types" id="tiposEnemigo">
          <span class="tag" id="tipoEnemigo">--</span>
        </div>
        <div class="is-flex is-justify-content-space-between is-align-items-center character-footer">
          <span id="indicadoresEnemigo">🟢🟢🟢</span>
          <span id="propietarioEnemigo">Equipo Enemigo</span>
        </div>
      </div>
    </article>

  </section>

  <!-- ACTION MENU -->
  <section class="menu" id="menuAcciones">
    <div class="columns is-mobile is-variable is-1 action-layout">
      <!-- MESSAGE -->
      <div class="column is-7" id="textColumn">
        <div class="box msg has-text-black" id="mensajeAccion">
          <span><span class= "has-text-weight-bold" id="turnoActual">Equipo Aliado</span> • Elige una opción/acción.</span>
          <p id="preguntaAccion">¿Qué quieres que haga -Insertar Gato-?</p>
          <span id="instruccionesAccion">(Haz click, o usa teclado para elegir un botón)</span>
        </div>
      </div>

      <!-- BUTTON GRID -->
      <div class="column is-5" id="buttonColumn" style="max-height: 130px;">
        <div class="btns grid-4" id="botonesAccion">
          <button class="button b" id="botonPelear" style="background-color: #ad2222;"><span>⚔ Pelear</span><span class="k">1</span></button>
          <button class="button b" id="botonPersonajes" style="background-color: #16b646;"><span>👥 Personajes</span><span class="k">2</span></button>
          <button class="button b" id="botonMochila" style="background-color: #b69d10;"><span>🎒 Mochila</span><span class="k">3</span></button>
          <button class="button b" id="botonHuir" style="background-color: #1553af;"><span>🏃 Huir</span><span class="k">4</span></button>

          <button class="button b pelear" id="botonElegirPersonaje" style="display: none; background-color: #16b646;"><span>✅ Aplicar</span><span class="k">1</span></button>
          <button class="button b pers" id="botonCancelarMochila" style="display: none; background-color: #ad2222;"><span>❌ Cancelar</span><span class="k">2</span></button>

          <button class="button b pelear" id="enviarPersonaje" style="display: none; background-color: #16b646;"><span>✅ Enviar Gato</span><span class="k">1</span></button>
          <button class="button b pers" id="cancelarPersonaje" style="display: none; background-color: #ad2222;"><span>❌ Cancelar</span><span class="k">2</span></button>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
<script src="js/main.js"></script>
</html>
