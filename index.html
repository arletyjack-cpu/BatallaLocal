<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Batalla local</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="game has-text-black" id="juego">

  <!-- MAIN MENU -->
  <section class="main-menu" id="mainMenu">
    <div class="arena-background blurred"></div>
    <section class="section is-medium">
      <img class="main-title" src="resources/MainTitle.webp"></img>
    </section>
    <div class="columns is-one-third">
      <div class="column is-one-third">
        <span id="Aliados">
          <span><img class="personajes-retratos-main-screen" id="firstPortrait" src="resources/placeholder.webp" alt="Retrato de ${character.firstName}"></span>
          <span><img class="personajes-retratos-main-screen" id="secondPortrait" src="resources/placeholder.webp" alt="Retrato de ${character.firstName}"></span>
          <span><img class="personajes-retratos-main-screen" id="thirdPortrait" src="resources/placeholder.webp" alt="Retrato de ${character.firstName}"></span>
        </span>
      </div>
      <div class="column is-one-third" id="middleButtons">
        <div class="btns grid-2 has-text-centered">
          <button class="button b is-large" id="startGame" style="background-color: #f9ce36; color: #141b2d; border: 4px solid #000000;"><span class="mx-auto is-size-3">Empezar Partida</span></button>
          <button onclick="window.close()" class="button b is-large" id="quitGame" style="background-color: #f9ce36; color: #141b2d; border: 4px solid #000000;"><span class="mx-auto is-size-3">Salir</span></button>
        </div>
      </div>
      <div class="column is-one-third">
        <span id="Enemigos">
          <span><img class="personajes-retratos-main-screen" id="firstPortrait" src="resources/placeholder.webp" alt="Retrato de ${character.firstName}"></span>
          <span><img class="personajes-retratos-main-screen" id="secondPortraitPartTwo" src="resources/placeholder.webp" alt="Retrato de ${character.firstName}"></span>
          <span><img class="personajes-retratos-main-screen" id="thirdPortrait" src="resources/placeholder.webp" alt="Retrato de ${character.firstName}"></span>
        </span>
      </div>
    </div>
    <img class="splashScreen" id="loadingScreen" src="resources/SplashScreen.webp" alt="Cargando...">
  </section>

  <!-- PERSONAJES -->
  <section class="menuGui" id="personajes" style="display: none;"></section>

  <!-- MOCHILA -->
  <section class="menuGui" id="mochila" style="display: none;"></section>

  <!-- BATTLE ARENA -->
  <section class="arena main-gui" id="arena" style="display: none">
    <div class="arena-background" id="arenaBackground" aria-hidden="true"></div>

    <!-- BATTLE HUD -->
    <div class="hud" id="informacionBatalla">

      <!-- PLAYER 1 -->
      <div class="life life-player1" id="estadoAliado">
        <div class="health-bar">
          <progress class="progress is-success" id="barraVidaAliado" value="67" max="67" aria-label="Vida del aliado"></progress>
          <span class="health-bar-fill" aria-hidden="true"></span>
          <div class="health-label">
            <span>Vida</span><span id="vidaAliado">--</span>
          </div>
        </div>
        <div class="tag turn-tag" id="turnoAliado">Equipo aliado/ Tu turno</div>
      </div>

      <!-- ROUND -->
      <div class="round has-text-centered" id="ronda">
        <span class="has-text-weight-bold" id="clima">Dia Templado</span>
        <small id="ventajaElemental" style="max-width: 180px;">Todo x67</small>
      </div>

      <!-- PLAYER 2 -->
      <div class="life life-player2" id="estadoEnemigo">
        <div class="health-bar">
          <progress class="progress is-success" id="barraVidaEnemigo" value="67" max="67" aria-label="Vida del enemigo"></progress>
          <span class="health-bar-fill" aria-hidden="true"></span>
          <div class="health-label">
            <span>Vida</span><span id="vidaEnemigo">--</span>
          </div>
        </div>
        <div class="tag turn-tag" id="turnoEnemigo">Equipo rival</div>
      </div>
    </div>

    <!-- CHARACTERS -->

    <!-- PLAYER CARD -->
    <div class="player-cat" id="canvasAliado">
      <img class="player-image" id="imagenAliado" src="resources/placeholder.webp" alt="Aliado">
      <img class="player-overlay" id="overlayAliado" src="resources/Halo.webp" alt="Halo">
    </div>

    <article class="card character-card jugador" id="tarjetaAliado">
      <div class="card-content">
        <div class="is-flex is-justify-content-space-between is-align-items-center">
          <strong id="nombreAliado">Gato Bobo</strong>
          <span id="nivelAliado">Nv 67</span>
        </div>
        <div class="is-flex is-justify-content-space-between character-types" id="tiposAliado">
          <span class="tag" id="tipoAliado">--</span>
        </div>
        <div class="is-flex is-justify-content-space-between is-align-items-center character-footer">
          <span id="propietarioAliado">Equipo Aliado</span>
          <span id="indicadoresAliado">🟢🟢🟢</span>
        </div>
      </div>
    </article>

    <!-- ENEMY CARD -->
    <div class="enemy-cat" id="canvasEnemigo">
      <img class="enemy-image" id="imagenEnemigo" src="resources/placeholder.webp" alt="Enemigo">
      <img class="enemy-overlay" id="overlayEnemigo" src="resources/Horns.webp" alt="Horns">
    </div>
    <article class="card character-card enemigo" id="tarjetaEnemigo">
      <div class="card-content">
        <div class="is-flex is-justify-content-space-between is-align-items-center">
          <span id="nivelEnemigo">Nv 67</span>
          <strong id="nombreEnemigo">Gato Tonto</strong>
        </div>
        <div class="is-flex is-justify-content-space-between character-types" id="tiposEnemigo">
          <span class="tag" id="tipoEnemigo">--</span>
        </div>
        <div class="is-flex is-justify-content-space-between is-align-items-center character-footer">
          <span id="indicadoresEnemigo">🟢🟢🟢</span>
          <span id="propietarioEnemigo">Equipo Enemigo</span>
        </div>
      </div>
    </article>

  </section>

  <!-- ACTION MENU -->
  <section class="menu" id="menuAcciones" style="display: none">
    <div class="columns is-mobile is-variable is-1 action-layout">
      <!-- MESSAGE -->
      <div class="column is-7" id="textColumn">
        <div class="box msg has-text-black" id="mensajeAccion">
          <span><span class= "has-text-weight-bold" id="turnoActual">Equipo Aliado</span> • Elige una opción/acción.</span>
          <p id="preguntaAccion">¿Qué quieres que haga -Insertar Gato-?</p>
          <span id="instruccionesAccion">(Haz click, o usa teclado para elegir un botón)</span>
        </div>
      </div>

      <!-- BUTTON GRID -->
      <div class="column is-5" id="buttonColumn" style="max-height: 175px;">
        <div class="btns grid-4" id="botonesAccion">
          <button class="button b" id="botonPelear" style="background-color: #ad2222;"><span>⚔ Pelear</span></button>
          <button class="button b" id="botonPersonajes" style="background-color: #16b646;"><span>👥 Personajes</span></button>
          <button class="button b" id="botonMochila" style="background-color: #b69d10;"><span>🎒 Mochila</span></button>
          <button class="button b" id="botonHuir" style="background-color: #1553af;"><span>🏃 Huir</span></button>

          <button class="button b" id="botonElegirPersonaje" style="display: none; background-color: #16b646;"><span>✅ Aplicar</span></button>
          <button class="button b" id="botonCancelarMochila" style="display: none; background-color: #ad2222;"><span>❌ Cancelar</span></button>

          <button class="button b" id="enviarPersonaje" style="display: none; background-color: #16b646;"><span>✅ Enviar Gato</span></button>
          <button class="button b" id="cancelarPersonaje" style="display: none; background-color: #ad2222;"><span>❌ Cancelar</span></button>

          <button onclick="window.location.reload()" class="button b" id="reiniciar" style="display: none; background-color: #1470da;"><span>🔄 Jugar Otra vez</span></button>
          <button onclick="window.close()" class="button b" id="salir" style="display: none; background-color: #ad2222;"><span>❌ Salir del juego</span></button>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
<script src="js/main.js"></script>
</html>
